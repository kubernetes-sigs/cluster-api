# See https://cloud.google.com/cloud-build/docs/build-config
timeout: 3600s
options:
  substitution_option: ALLOW_LOOSE
  machineType: 'E2_HIGHCPU_8'
steps:
  # The latest image tag + sha can be found with:
  # crane ls registry.k8s.io/releng/gcb-docker-gcloud
  # crane digest registry.k8s.io/releng/gcb-docker-gcloud:v20261022
  - name: 'registry.k8s.io/releng/gcb-docker-gcloud@sha256:2bf2ec376b86cf5ebdb3a598f6dca69d5f977477315c870a0ce0847563dc148e' # v20261022
    entrypoint: make
    env:
    - DOCKER_CLI_EXPERIMENTAL=enabled
    - TAG=$_GIT_TAG
    - PULL_BASE_REF=$_PULL_BASE_REF
    - DOCKER_BUILDKIT=1
    args:
    - release-staging-nightly
substitutions:
  # _GIT_TAG will be filled with a git-based tag for the image, of the form vYYYYMMDD-hash, and
  # can be used as a substitution
  _GIT_TAG: '12345'
  _PULL_BASE_REF: 'dev'
