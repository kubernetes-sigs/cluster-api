# Aggregates read-only access to the kubeadm control plane resources into the builtin "view",
# "edit" and "admin" ClusterRoles. "edit" and "admin" do not inherit the rules aggregated into
# "view", hence the additional labels.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: viewer-role
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
- apiGroups:
  - controlplane.cluster.x-k8s.io
  resources:
  - kubeadmcontrolplanes
  - kubeadmcontrolplanes/status
  - kubeadmcontrolplanes/scale
  - kubeadmcontrolplanetemplates
  verbs:
  - get
  - list
  - watch
