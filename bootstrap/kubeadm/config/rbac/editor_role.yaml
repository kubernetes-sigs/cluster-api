# Aggregates write access to the kubeadm bootstrap resources into the builtin "edit" and "admin"
# ClusterRoles.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: editor-role
  labels:
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
- apiGroups:
  - bootstrap.cluster.x-k8s.io
  resources:
  - kubeadmconfigtemplates
  - kubeadmconfigs
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
